name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # onnxruntime-node (transitive via transformers.js) tries to fetch Linux
      # CUDA binaries on install; the v1.21.0 asset currently 404s and Cadence
      # only uses WASM/WebGPU. Skip that optional download.
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build static site
        run: npm run build